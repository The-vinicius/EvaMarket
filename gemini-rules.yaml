# gemini-rules.yaml

ignore_directories:
  - build/
  - .dart_tool/
  - .symlinks/
  - ios/Pods/
  - android/.gradle/
  - .idea/ # Para projetos com IDEs como IntelliJ/Android Studio

ignore_file_patterns:
  - "*.log"
  - "*.bak"
  - "**/*.g.dart" # Arquivos gerados por build_runner, se você não precisa que o CLI os analise

flutter_commands:
  clean_and_get: "flutter clean && flutter pub get"
  run_dev: "flutter run --flavor development"

optimization_rules:
  - rule_id: "avoid_unnecessary_rebuilds"
    description: "Suggest using const constructors where possible."
    pattern: "new [A-Z].*StatefulWidget\\(" # Exemplo: uma regex para encontrar possíveis widgets que poderiam ser const
    action: "warn"
